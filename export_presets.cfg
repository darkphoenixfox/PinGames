custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// ?log-shaders (D-179): log every WebGL shader compiled, with its #define lines, to find shader variants that compile mid-game.
if (location.search.indexOf(\"log-shaders\") >= 0) {
  const t0 = performance.now();
  const orig = WebGL2RenderingContext.prototype.shaderSource;
  WebGL2RenderingContext.prototype.shaderSource = function (sh, src) {
    const defs = (src.match(/^#define [A-Z_0-9]+.*$/gm) || []).filter(function (d) { return !/^#define (M_PI|SHADER_IS_SRGB|SHADER_|precision)/.test(d); }).join(\" \");
    const kind = /gl_Position/.test(src) ? \"VS\" : \"FS\";
    const blk = src.match(/MaterialUniforms \{([^}]*)\}/); const mat = (blk ? blk[1].split(String.fromCharCode(10)).join(\" \").slice(0, 300) : \"\") + \" | \" + ((src.match(/uniform highp sampler2D m_[a-z_]+/g) || []).join(\",\"));
    console.log(\"Shader \" + kind + \" at \" + ((performance.now() - t0) / 1000).toFixed(2) + \" s: \" + defs.slice(0, 600) + \" || \" + mat);
    return orig.call(this, sh, src);
  };
}
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
